name: Publish weekly DDN feature
on:
  schedule:
    - cron: '17 9 * * 5'
      timezone: 'Europe/Vienna'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generate this week's feature
        env:
          SITE_URL: ${{ vars.SITE_URL }}
        run: python scripts/generate.py
      - name: Commit generated feature
        run: |
          git config user.name "DDN Weekly Bot"
          git config user.email "actions@users.noreply.github.com"
          git add .
          git diff --cached --quiet || git commit -m "Publish DDN weekly feature $(date +%F)"
          git push
